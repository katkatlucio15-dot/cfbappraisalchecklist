<!DOCTYPE html>
<html>
<head>
  <title>Unit Condition Scoring</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      background: red;
      color: white;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
    }

    th {
      background: black;
      color: white;
    }

    select {
      padding: 5px;
      font-size: 16px;
      width: 70px;
    }

    .result {
      font-weight: bold;
      font-size: 18px;
    }

    /* Message shown when categories are incomplete */
    #warning {
      display: none;
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #ffe6e6;
      color: red;
      font-weight: bold;
      border: 1px solid red;
      border-radius: 5px;
    }

    /* Hide results until everything is filled */
    #results {
      display: none;
    }
  </style>
</head>

<body>

<h1>UNIT CONDITION SCORING (Enter 0–3 only)</h1>

<table>
  <thead>
    <tr>
      <th>Category</th>
      <th>Score (0–3)</th>
      <th>Weight</th>
      <th>Weighted Score</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>

  <!-- RESULTS -->
  <tbody id="results">

    <tr>
      <td colspan="3"><b>Total Score</b></td>
      <td id="total">0.00</td>
    </tr>

    <tr>
      <td colspan="3"><b>Classification</b></td>
      <td id="grade" class="result">-</td>
    </tr>

  </tbody>

</table>

<!-- WARNING MESSAGE -->
<div id="warning">
  ⚠️ Please fill out all categories first.
</div>


<script>

  // CATEGORY ORDER MATCHES THE PICTURE
  const data = [
    { name: "Mileage", weight: 0.10 },
    { name: "Tires", weight: 0.05 },
    { name: "Frame, Stand, Headlight", weight: 0.20 },
    { name: "Oil Leaks", weight: 0.15 },
    { name: "Starting", weight: 0.15 },
    { name: "Engine Sound", weight: 0.20 },
    { name: "Brakes", weight: 0.10 },
    { name: "Fuel Tank", weight: 0.05 }
  ];


  const tbody = document.getElementById("tableBody");


  // CREATE TABLE ROWS
  data.forEach((item, i) => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name}</td>

      <td>
        <select onchange="calculate()">

          <option value="">-</option>

          <option value="3">3</option>

          <option value="2">2</option>

          <option value="1">1</option>

          <option value="0">0</option>

        </select>
      </td>

      <td>${item.weight * 100}%</td>

      <td class="weighted">0.00</td>
    `;

    tbody.appendChild(row);

  });


  function calculate() {

    const rows = document.querySelectorAll("#tableBody tr");

    let allFilled = true;
    let total = 0;


    // CHECK IF ALL CATEGORIES HAVE AN INPUT
    rows.forEach((row, i) => {

      const select = row.querySelector("select");

      const score = parseFloat(select.value);


      // If no score was selected
      if (isNaN(score)) {

        allFilled = false;

        row.querySelector(".weighted").textContent = "0.00";

      } 

      else {

        const weight = data[i].weight;

        const weighted = score * weight;

        row.querySelector(".weighted").textContent =
          weighted.toFixed(2);

        total += weighted;

      }

    });


    // GET WARNING AND RESULTS ELEMENTS
    const warning = document.getElementById("warning");

    const results = document.getElementById("results");


    // IF NOT EVERYTHING IS FILLED
    if (!allFilled) {

      // Show warning
      warning.style.display = "block";

      // Hide total and classification
      results.style.display = "none";

      return;
    }


    // EVERYTHING IS FILLED
    warning.style.display = "none";

    results.style.display = "table-row-group";


    // DISPLAY TOTAL
    document.getElementById("total").textContent =
      total.toFixed(2);


    // CLASSIFICATION
    let grade = "-";


    if (total >= 2.5) {

      grade = "A";

    }

    else if (total >= 1.8) {

      grade = "B";

    }

    else if (total >= 1) {

      grade = "C";

    }

    else if (total > 0) {

      grade = "Reject";

    }


    document.getElementById("grade").textContent = grade;

  }

</script>

</body>
</html>
